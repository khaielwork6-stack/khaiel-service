name: Update Roblox stats

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  push:
    paths:
      - data/roblox.config.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats from Roblox
        shell: pwsh
        run: ./scripts/update-roblox.ps1
      - name: Commit if anything changed
        run: |
          git config user.name "roblox-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/roblox.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Roblox stats"
            git push
          fi
